name: Linux

on:
  workflow_call:
    inputs:
      ai_release:
        description: Validate and collect an AI experimental build
        type: boolean
        default: false
  push:
    branches:
      - master
      - 'Stable*'
    tags:
      - 'v*'
      - '!v*-ai.*'
    paths-ignore:
      - 'docs/**' # Do not trigger for any changes under docs
  pull_request:
    paths:
      - '.github/workflows/linux.yml'
      - '.github/actions/**'
      - 'deploy/linux/**'
      - 'src/**'
      - 'test/**'
      - 'CMakeLists.txt'
      - 'cmake/**'

# concurrency:
#   group: ${{ github.workflow }}-${{ github.ref }}
#   cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        BuildType: [Debug, Release]
        # Arch: [x64] # Arm64

    defaults:
      run:
        shell: bash

    env:
      ARTIFACT: QGroundControl-x86_64.AppImage
      PACKAGE: QGroundControl-x86_64
      QT_VERSION: 6.8.3

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Initial Setup
        uses: ./.github/actions/common

      - name: Install Dependencies
        run: |
          chmod a+x ./tools/setup/install-dependencies-debian.sh
          sudo ./tools/setup/install-dependencies-debian.sh

      - name: Install Vulkan
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list http://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          sudo apt update
          sudo apt install vulkan-sdk

      - name: Setup Caching
        uses: ./.github/actions/cache
        with:
          host: linux
          target: linux_gcc_64
          build-type: ${{ matrix.BuildType }}
          cpm-modules: ${{ runner.temp }}/shadow_build_dir/cpm_modules

      - name: Install Qt for Linux (x64)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          dir: ${{ runner.temp }}
          modules: qtcharts qtlocation qtpositioning qtspeech qt5compat qtmultimedia qtserialport qtimageformats qtshadertools qtconnectivity qtquick3d qtsensors
          cache: true

      # - name: Build GStreamer
      #   uses: ./.github/actions/gstreamer

      - name: Configure
        working-directory: ${{ runner.temp }}/shadow_build_dir
        run: ${{ env.QT_ROOT_DIR }}/bin/qt-cmake -S ${{ github.workspace }} -B . -G Ninja
              -DCMAKE_BUILD_TYPE=${{ matrix.BuildType }}
              -DQGC_BUILD_TESTING=${{ matrix.BuildType == 'Debug' && 'ON' || 'OFF' }}
              -DQGC_STABLE_BUILD=${{ (inputs.ai_release || github.ref_type == 'tag' || contains(github.ref, 'Stable')) && 'ON' || 'OFF' }}

      - name: Build
        working-directory: ${{ runner.temp }}/shadow_build_dir
        run: cmake --build . --target all --config ${{ matrix.BuildType }}

      - name: Create AppImage
        if: matrix.BuildType == 'Release' || !inputs.ai_release
        working-directory: ${{ runner.temp }}/shadow_build_dir
        run: cmake --install . --config ${{ matrix.BuildType }}

      - name: Sanity check release executable
        if: matrix.BuildType == 'Release'
        working-directory: ${{ runner.temp }}/shadow_build_dir
        run: xvfb-run -a ./${{ env.ARTIFACT }} --appimage-extract-and-run --simple-boot-test

      - name: Run unit tests
        if: matrix.BuildType == 'Debug' && !inputs.ai_release
        working-directory: ${{ runner.temp }}/shadow_build_dir
        run: xvfb-run -a ./${{ env.ARTIFACT }} --unittest

      - name: Run AI diagnostic tests
        if: matrix.BuildType == 'Debug' && inputs.ai_release
        working-directory: ${{ runner.temp }}/shadow_build_dir
        run: xvfb-run -a ctest --output-on-failure -R '^(AIDiagnosticControllerTest|CodexAppServerClientTest)$'

      - name: Record AI build provenance
        if: matrix.BuildType == 'Release' && inputs.ai_release
        run: python3 tools/ai_release/ai_release.py record --platform linux --directory "${{ runner.temp }}/shadow_build_dir"

      - name: Save AI package
        if: matrix.BuildType == 'Release' && inputs.ai_release
        uses: actions/upload-artifact@v4
        with:
          name: ai-linux
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/shadow_build_dir/${{ env.ARTIFACT }}
            ${{ runner.temp }}/shadow_build_dir/build-info-linux.json

      - name: Upload Build File
        if: matrix.BuildType == 'Release' && !inputs.ai_release
        uses: ./.github/actions/upload
        with:
          artifact_name: ${{ env.ARTIFACT }}
          package_name: ${{ env.PACKAGE }}
          aws_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

name: Windows

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - 'Stable*'
      - 'codex/qgc-ai-windows-*'
    tags:
      - 'v*'
    paths-ignore:
      - 'docs/**' # Do not trigger for any changes under docs
  pull_request:
    paths:
      - '.github/workflows/windows.yml'
      - 'deploy/windows/**'
      - 'src/**'
      - 'CMakeLists.txt'
      - 'cmake/**'

# concurrency:
#   group: ${{ github.workflow }}-${{ github.ref }}
#   cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120

    strategy:
      matrix:
        BuildType: [Release]
        Arch: [x64] # Arm64

    defaults:
      run:
        shell: cmd

    env:
      ARTIFACT: QGroundControl-installer.exe
      PACKAGE: QGroundControl-installer
      QT_VERSION: 6.8.3
      GST_VERSION: 1.22.12

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
          fetch-tags: false

      - name: Get all tags for correct version determination
        working-directory:  ${{ github.workspace }}
        run: |
          git fetch --all --tags -f --depth 1

      - name: Initial Setup
        uses: ./.github/actions/common

      - name: Install Vulkan
        working-directory: ${{ runner.temp }}
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe" -OutFile vulkan-sdk.exe
          .\vulkan-sdk.exe --root C:\VulkanSDK\latest --accept-licenses --default-answer --confirm-command install com.lunarg.vulkan.glm com.lunarg.vulkan.volk com.lunarg.vulkan.vma com.lunarg.vulkan.debug
          echo "VULKAN_SDK=C:\VulkanSDK\latest" >> $env:GITHUB_ENV

      - name: Install GStreamer
        uses: blinemedical/setup-gstreamer@v1
        with:
          version: ${{ env.GST_VERSION }}

      - name: Install NSIS
        run: choco install nsis -y
        shell: powershell

      - name: Setup Caching
        uses: ./.github/actions/cache
        with:
          host: windows
          target: win64_msvc2022_64
          build-type: ${{ matrix.BuildType }}
          cpm-modules: ${{ runner.temp }}\shadow_build_dir\cpm_modules

      - name: Install Qt for Windows (x64)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          dir: ${{ runner.temp }}
          modules: qtcharts qtlocation qtpositioning qtspeech qt5compat qtmultimedia qtserialport qtimageformats qtshadertools qtconnectivity qtquick3d qtsensors
          cache: true

      # Note: Must Use QtMultimedia VideoReceiver or build GStreamer manually
      - name: Install Qt for Windows (Arm64)
        if: matrix.Arch == 'Arm64'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          aqtversion: ==3.1.19
          host: windows
          target: desktop
          arch: win64_msvc2022_arm64_cross_compiled
          dir: ${{ runner.temp }}
          modules: qtcharts qtlocation qtpositioning qtspeech qt5compat qtmultimedia qtserialport qtimageformats qtshadertools qtconnectivity qtquick3d qtsensors

      - name: Set up Visual Studio shell
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.Arch == 'Arm64' && 'amd64_arm64' || 'x64' }}

      - name: Configure
        working-directory: ${{ runner.temp }}\shadow_build_dir
        run: ${{ env.QT_ROOT_DIR }}/bin/qt-cmake -S ${{ github.workspace }} -B . -G Ninja
              -DCMAKE_BUILD_TYPE=${{ matrix.BuildType }}
              -DQT_HOST_PATH="${{ env.QT_ROOT_DIR }}/../msvc2022_64"
              -DQT_DEBUG_FIND_PACKAGE=ON
              -DCMAKE_INSTALL_PREFIX="${{ runner.temp }}/qgc-ai-staging"
              -DQGC_STABLE_BUILD=${{ github.ref_type == 'tag' || contains(github.ref, 'Stable') && 'ON' || 'OFF' }}

      - name: Build
        working-directory: ${{ runner.temp }}\shadow_build_dir
        run: cmake --build . --target all --config ${{ matrix.BuildType }}

      - name: Sanity check release excecutable
        if: matrix.BuildType == 'Release'
        working-directory: ${{ runner.temp }}\shadow_build_dir\Release
        run: QGroundControl.exe --simple-boot-test

      - name: Install
        working-directory: ${{ runner.temp }}\shadow_build_dir
        run: cmake --install . --config ${{ matrix.BuildType }}

      - name: Verify installed AI application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'shadow_build_dir/QGroundControl-installer.exe'
          if (-not (Test-Path $installer)) { throw 'Installer was not generated' }
          # The hosted runner has no UAV hardware; skip the interactive driver MSI.
          New-Item 'HKCU:\SOFTWARE\MichaelOborne\driver' -Force | Out-Null
          New-ItemProperty 'HKCU:\SOFTWARE\MichaelOborne\driver' -Name installed -Value 1 -PropertyType DWord -Force | Out-Null
          New-Item 'HKCU:\SOFTWARE\QGroundControlUAVDrivers' -Force | Out-Null
          New-ItemProperty 'HKCU:\SOFTWARE\QGroundControlUAVDrivers' -Name version -Value 3 -PropertyType DWord -Force | Out-Null
          $installDir = Join-Path $env:RUNNER_TEMP 'qgc-ai-install-test'
          $installProcess = Start-Process $installer -ArgumentList '/S', "/D=$installDir" -PassThru
          if (-not $installProcess.WaitForExit(180000)) {
            $installProcess.Kill()
            throw 'Installer timed out'
          }
          if ($installProcess.ExitCode -ne 0) { throw "Installer failed: $($installProcess.ExitCode)" }
          $binary = Join-Path $installDir 'bin/QGroundControl.exe'
          if (-not (Test-Path $binary)) { throw 'Installed executable is missing' }
          $binaryText = [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes($binary))
          foreach ($component in @('AIDiagnosticController', 'CodexAppServerClient', 'AIAssistantSettings')) {
            if (-not $binaryText.Contains($component)) { throw "Missing AI component: $component" }
            Write-Host "AI component verified: $component"
          }
          # Verify deployed dependencies without the build SDK directories on PATH.
          $env:PATH = (($env:PATH -split ';') | Where-Object { $_ -and $_ -notmatch '(?i)gstreamer|msvc2022_64' }) -join ';'
          foreach ($name in @('QT_PLUGIN_PATH', 'QML2_IMPORT_PATH', 'QML_IMPORT_PATH')) {
            Remove-Item "Env:$name" -ErrorAction SilentlyContinue
          }
          $boot = Start-Process $binary -ArgumentList '--simple-boot-test' -WorkingDirectory (Split-Path $binary) -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP/qgc-ai-boot.stdout.log" -RedirectStandardError "$env:RUNNER_TEMP/qgc-ai-boot.stderr.log"
          if (-not $boot.WaitForExit(120000)) {
            $boot.Kill()
            throw 'Installed application boot test timed out'
          }
          Get-Content "$env:RUNNER_TEMP/qgc-ai-boot.stderr.log"
          if ($boot.ExitCode -ne 0) { throw "Installed application failed to start: $($boot.ExitCode)" }
          Write-Host 'Installed AI application boot test passed'

      - name: Prepare installer and checksum
        shell: pwsh
        run: |
          $packageDir = Join-Path $env:RUNNER_TEMP 'qgc-ai-package'
          New-Item $packageDir -ItemType Directory -Force | Out-Null
          $name = 'QGroundControl-AI-Windows-x64-20260914-installer.exe'
          Copy-Item "$env:RUNNER_TEMP/shadow_build_dir/QGroundControl-installer.exe" (Join-Path $packageDir $name)
          $hash = (Get-FileHash (Join-Path $packageDir $name) -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content (Join-Path $packageDir 'SHA256SUMS.txt') -Encoding ascii
          @(
            'QGroundControl AI Assistant - Windows x64 Release',
            'Application source: 5f869595db94f35c0a30bfdd5a1cb211a91e4fcd',
            "Build commit: $env:GITHUB_SHA",
            "Build run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID",
            'Qt: 6.8.3; GStreamer: 1.22.12; toolchain: MSVC 2022',
            'Validation: installed executable boot test; AI components present',
            'Experimental build; installer is not code-signed.'
          ) | Set-Content (Join-Path $packageDir 'BUILD-INFO.txt') -Encoding utf8

      - name: Upload Windows AI installer
        uses: actions/upload-artifact@v4
        with:
          name: QGroundControl-AI-Windows-x64-20260914
          path: ${{ runner.temp }}/qgc-ai-package/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload boot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QGroundControl-AI-Windows-boot-logs
          path: ${{ runner.temp }}/qgc-ai-boot.*.log
          if-no-files-found: ignore
          retention-days: 7

name: Windows

on:
  push:
    branches:
      - codex/windows-v5.0.3-1258-979c630b2
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: false
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read
  actions: read

env:
  AQT_SOURCE: 'git+https://github.com/miurahr/aqtinstall.git@8d961e61720b3c06583517fbc68d57ec0a4e9f95'

jobs:
  build:
    name: Build ${{ matrix.arch }} ${{ matrix.build_type }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 120

    # id-token/attestations scoped here: only the attestation upload step needs them.
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write

    strategy:
      fail-fast: false
      matrix:
        build_type: ['${{ inputs.build_type || ''Release'' }}']
        variant: [amd64]
        include:
          - variant: amd64
            runs_on: windows-2022
            host: windows
            arch: win64_msvc2022_64
            package: QGroundControl-installer-AMD64
            gstreamer: true

    defaults:
      run:
        shell: cmd

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: 979c630b27946ac4edc604480e73a052102a9ac0
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source identity
        shell: pwsh
        env:
          EXPECTED_SOURCE_SHA: 979c630b27946ac4edc604480e73a052102a9ac0
          EXPECTED_SOURCE_VERSION: v5.0.3-1258-g979c630b2
          EXPECTED_SOURCE_DATE: '2026-08-11T17:00:22+08:00'
          BUILD_TYPE: ${{ matrix.build_type }}
        run: |
          $sourceSha = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $sourceSha -ne $env:EXPECTED_SOURCE_SHA) {
            throw "Unexpected source commit: $sourceSha"
          }
          $sourceVersion = git describe --always --tags
          if ($LASTEXITCODE -ne 0 -or $sourceVersion -ne $env:EXPECTED_SOURCE_VERSION) {
            throw "Unexpected source version: $sourceVersion"
          }
          $sourceDate = git log -1 --format=%aI
          if ($LASTEXITCODE -ne 0 -or $sourceDate -ne $env:EXPECTED_SOURCE_DATE) {
            throw "Unexpected source date: $sourceDate"
          }
          git diff-index --quiet HEAD --
          if ($LASTEXITCODE -ne 0) {
            throw "Source checkout contains tracked modifications"
          }
          $config = Get-Content .github/build-config.json -Raw | ConvertFrom-Json
          $manifest = [ordered]@{
            source_commit = $sourceSha
            source_version = $sourceVersion
            source_date = $sourceDate
            workflow_commit = $env:GITHUB_SHA
            repository = $env:GITHUB_REPOSITORY
            workflow_run = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            architecture = "AMD64"
            build_type = $env:BUILD_TYPE
            stable_build = $false
            qt_version = $config.qt.version
            gstreamer_version = $config.gstreamer.version.windows
          }
          $buildDir = Join-Path $env:RUNNER_TEMP "build"
          New-Item -ItemType Directory -Path $buildDir -Force | Out-Null
          $manifest | ConvertTo-Json | Set-Content (Join-Path $buildDir "QGroundControl-source-manifest.json") -Encoding utf8
          Write-Host "Verified source: $sourceVersion ($sourceSha), $sourceDate"

      - name: Build Setup
        id: build-setup
        uses: ./.github/actions/build-setup
        with:
          qt-host: ${{ matrix.host }}
          qt-arch: ${{ matrix.arch }}
          aqt-source: ${{ env.AQT_SOURCE }}
          build-type: ${{ matrix.build_type }}

      - name: Configure
        uses: ./.github/actions/cmake-configure
        with:
          stable: 'false'
          build-dir: ${{ runner.temp }}/build
          build-type: ${{ matrix.build_type }}
          extra-args: >-
            -DQGC_STABLE_BUILD=OFF
            -DQGC_ENABLE_GST_VIDEOSTREAMING=${{ matrix.gstreamer && 'ON' || 'OFF' }}
            ${{ matrix.arch == 'win64_msvc2022_arm64_cross_compiled' && format('-DQT_HOST_PATH={0}', steps.build-setup.outputs.host_qt_root_dir) || '' }}

      - name: Resolve GStreamer root
        id: gst-root
        if: matrix.gstreamer
        shell: bash
        run: |
          python3 "${GITHUB_WORKSPACE}/.github/scripts/cmake_helper.py" cache-var \
            --build-dir "${RUNNER_TEMP}/build" \
            --name GStreamer_ROOT_DIR \
            --required \
            --output-key gst_root

      - name: Add GStreamer to PATH
        if: matrix.gstreamer
        shell: bash
        run: echo "${STEPS_GST_ROOT_OUTPUTS_GST_ROOT}/bin" >> "$GITHUB_PATH"
        env:
          STEPS_GST_ROOT_OUTPUTS_GST_ROOT: ${{ steps.gst-root.outputs.gst_root }}

      - name: Build
        uses: ./.github/actions/cmake-build
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: ${{ matrix.build_type }}

      - name: Verify Executable
        if: matrix.build_type == 'Release' && matrix.arch != 'win64_msvc2022_arm64_cross_compiled'
        uses: ./.github/actions/verify-executable
        with:
          binary-path: ${{ runner.temp }}/build/${{ matrix.build_type }}/QGroundControl.exe
          type: exe
          build-dir: ${{ runner.temp }}/build

      - name: Create Installer
        uses: ./.github/actions/cmake-install
        with:
          build-dir: ${{ runner.temp }}\build
          build-type: ${{ matrix.build_type }}

      - name: Install and verify installer
        if: matrix.build_type == 'Release' && matrix.arch != 'win64_msvc2022_arm64_cross_compiled'
        shell: pwsh
        run: |
          $buildDir = "${{ runner.temp }}\build"
          $installerExe = Get-ChildItem -Path $buildDir -Filter "*installer*.exe" | Select-Object -First 1
          if (-not $installerExe) {
            Write-Error "Installer .exe not found in $buildDir"
            exit 1
          }
          $installDir = "${{ runner.temp }}\qgc-install-test"
          Write-Host "Installing $($installerExe.Name) to $installDir"
          $installerProcess = Start-Process -FilePath $installerExe.FullName -ArgumentList "/S", "/D=$installDir" -Wait -NoNewWindow -PassThru
          if ($installerProcess.ExitCode -ne 0) {
            throw "Installer failed with exit code $($installerProcess.ExitCode)"
          }
          $binary = Join-Path $installDir "bin\QGroundControl.exe"
          if (-not (Test-Path $binary)) {
            Write-Error "QGroundControl.exe not found at $binary after install"
            Get-ChildItem -Path $installDir -Recurse | Select-Object FullName
            exit 1
          }
          $expectGstreamer = "${{ matrix.gstreamer }}" -eq "true"
          $pluginDir = Join-Path $installDir "lib\gstreamer-1.0"
          if (-not $expectGstreamer) {
            Write-Host "GStreamer disabled for this build; skipping plugin verification"
          } elseif (Test-Path $pluginDir) {
            $pluginCount = (Get-ChildItem -Path $pluginDir -Filter "*.dll" | Measure-Object).Count
            Write-Host "GStreamer plugins found: $pluginCount"
            if ($pluginCount -eq 0) {
              Write-Error "No GStreamer plugin DLLs found in $pluginDir"
              exit 1
            }
          } else {
            Write-Error "GStreamer plugin directory not found: $pluginDir"
            exit 1
          }

      - name: Remove build SDK from PATH for installed verification
        if: matrix.build_type == 'Release' && matrix.gstreamer
        shell: pwsh
        env:
          GST_ROOT: ${{ steps.gst-root.outputs.gst_root }}
        run: |
          $sdkBin = Join-Path $env:GST_ROOT "bin"
          $sanitizedPath = (($env:PATH -split ';') | Where-Object { $_ -and ($_ -ne $sdkBin) }) -join ';'
          "QGC_VERIFY_INSTALLED_PATH=$sanitizedPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify installed executable
        if: matrix.build_type == 'Release' && matrix.arch != 'win64_msvc2022_arm64_cross_compiled'
        uses: ./.github/actions/verify-executable
        env:
          PATH: ${{ env.QGC_VERIFY_INSTALLED_PATH || env.PATH }}
        with:
          binary-path: ${{ runner.temp }}\qgc-install-test\bin\QGroundControl.exe
          type: exe

      - name: Record installer checksum
        if: matrix.build_type == 'Release'
        shell: pwsh
        run: |
          $buildDir = Join-Path $env:RUNNER_TEMP "build"
          $installer = Get-Item (Join-Path $buildDir "QGroundControl-installer-AMD64.exe")
          $manifestPath = Join-Path $buildDir "QGroundControl-source-manifest.json"
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json -AsHashtable
          $manifest.installer = $installer.Name
          $manifest.installer_sha256 = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest.installer_size_bytes = $installer.Length
          $manifest.built_at_utc = [DateTime]::UtcNow.ToString("o")
          $manifest | ConvertTo-Json | Set-Content $manifestPath -Encoding utf8

      - name: Upload source manifest
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@v7
        with:
          name: QGroundControl-source-manifest-AMD64
          path: ${{ runner.temp }}/build/QGroundControl-source-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Attest and Upload
        if: matrix.build_type == 'Release'
        uses: ./.github/actions/attest-and-upload
        with:
          artifact-name: ${{ matrix.package }}.exe
          package-name: ${{ matrix.package }}
          upload-aws: 'false'
